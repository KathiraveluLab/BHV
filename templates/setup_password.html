{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-panel-left">
        <div class="auth-card">
            <header class="auth-header">
                <h2>Vault Password</h2>
                <p>Create a secure password for your vault.</p>
            </header>
            <form action="{{ url_for('auth.setup_password') }}" method="POST" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password" autofocus>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required
                        autocomplete="new-password">
                </div>
                <button type="submit" class="btn-auth">Set Password</button>
            </form>
        </div>
    </div>
    <div class="auth-panel-right">
        <div class="brand-icon-large"></div>
        <div class="brand-content">
            <h1>Security First</h1>
            <p>Your password is the final key to your encrypted data.</p>
        </div>
    </div>
</div>
{% endblock %}
