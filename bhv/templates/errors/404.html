{% extends "base.html" %}
{% block title %}Page Not Found - BHV{% endblock %}
{% block content %}
<div style="max-width: 600px; margin: 100px auto; text-align: center;">
    <div style="background: white; padding: 60px 40px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
        <div style="font-size: 8rem; font-weight: bold; color: #e74c3c; margin-bottom: 20px;">404</div>
        <h2 style="color: #2c3e50; margin-bottom: 20px;">Page Not Found</h2>
        <p style="color: #666; font-size: 1.1rem; margin-bottom: 40px;">
            The page you are looking for doesn't exist or has been moved.
        </p>
        <a href="{{ url_for('index') }}" 
           style="display: inline-block; padding: 15px 40px; background: #3498db; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; font-size: 1.1rem; transition: background 0.3s;"
           onmouseover="this.style.background='#2980b9'"
           onmouseout="this.style.background='#3498db'">
            Go to Homepage
        </a>
    </div>
</div>
{% endblock %}
