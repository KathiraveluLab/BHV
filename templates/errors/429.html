{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/errors.css') }}">
{% endblock %}
{% block content %}
<div class="error-container">
    <div class="error-icon">🛑</div>
    <div class="error-code">429</div>
    <h1 class="fw-bold">Slow Down!</h1>
    <p class="error-message">You've made too many requests in a short time. <br> Please wait a minute before trying
        again.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-dark px-4">Return Home</a>
</div>
{% endblock %}
