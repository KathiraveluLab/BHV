{% extends "base.html" %}

{% block content %}
<div class="card" style="text-align: center; padding: 4rem 2rem;">
    <h1>Welcome to Behavioral Health Vault</h1>
    <p>A secure, minimalist space to record your recovery journey through imagery and narrative.</p>
    <div style="margin-top: 2rem;">
        {% if not current_user.is_authenticated %}
            <a href="{{ url_for('register') }}" border="1"><button>Get Started</button></a>
            <p style="margin-top: 1rem;">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
        {% else %}
            <a href="{{ url_for('dashboard') }}"><button>Go to your Dashboard</button></a>
        {% endif %}
    </div>
</div>
{% endblock %}
