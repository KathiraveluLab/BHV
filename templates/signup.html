{% extends "base.html" %}


{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
<style>
    .auth-divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 20px 0;
        color: #666;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .auth-divider::before,
    .auth-divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid #eee;
    }

    .auth-divider:not(:empty)::before {
        margin-right: .5em;
    }

    .auth-divider:not(:empty)::after {
        margin-left: .5em;
    }

    .btn-google {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 12px;
        background-color: #fff;
        border: 1px solid #dadce0;
        border-radius: 4px;
        color: #3c4043;
        font-weight: 500;
        text-decoration: none;
        transition: background-color 0.2s;
    }

    .btn-google:hover {
        background-color: #f8f9fa;
        border-color: #d2d2d2;
    }

    .google-icon {
        width: 18px;
        height: 18px;
        margin-right: 10px;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon"><i class="fas fa-notes-medical"></i></div>
            <h2>User Registration</h2>
            <p>Join the Behavioral Health Vault</p>
        </div>

        <form action="{{ url_for('auth.signup') }}" method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Name Surname e.g. Ramzan Khan" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="email@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Min. 8 characters" required>
                <p class="input-hint">Your password is hashed using salt-based protocols for data protection.
                </p>
            </div>

            <button type="submit" class="btn-auth">Register</button>

            <div class="auth-divider">OR</div>

            <a href="{{ url_for('auth.google_login') }}" class="btn-google">
                <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20px" height="20px">
                    <path fill="#FFC107"
                        d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.341,43.611,20.083z" />
                    <path fill="#FF3D00"
                        d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z" />
                    <path fill="#4CAF50"
                        d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z" />
                    <path fill="#1976D2"
                        d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.341,43.611,20.083z" />
                </svg>
                Sign up with Google
            </a>
        </form>

        <div class="auth-footer">
            <p>Existing account? <a href="{{ url_for('auth.login') }}"> login</a></p>
        </div>
    </div>
</div>
{% endblock %}
