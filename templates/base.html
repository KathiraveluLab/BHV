<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}BHV{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <nav>
      <a href="{{ url_for('index') }}" class="brand">BHV</a>
      <div class="nav-links">
        <a href="{{ url_for('index') }}">Home</a>
        {% if current_user.is_authenticated %}
        <form method="POST" action="{{ url_for('auth.logout') }}">
          <button type="submit" class="nav-button">Sign out</button>
        </form>
        {% else %}
        <a href="{{ url_for('auth.login') }}">Sign in</a>
        <a href="{{ url_for('auth.register') }}">Get started</a>
        {% endif %}
      </div>
    </nav>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
