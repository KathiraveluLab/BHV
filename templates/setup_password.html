{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon"><i class="fas fa-lock"></i></div>
            <h2>Create Your Password</h2>
            <p>Verification successful.Please create a Password</p>
        </div>

        <form action="{{ url_for('auth.setup_password') }}" method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Min. 8 characters" required autofocus>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat key" required>
            </div>
            <button type="submit" class="btn-auth">Register</button>
        </form>
    </div>
</div>
{% endblock %}
